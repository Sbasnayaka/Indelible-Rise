<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Indelible Rise | Login</title>
    <link rel="icon" type="image/png" href="assets/fav-icon.png">
    
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!-- Background image (abstract) -->
    <div class="login-bg"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="welcome-text">
                <div class="tagline">Welcome back !!!</div>
            </div>

            <form id="login-form">
                <div class="input-field">
                    <label for="email">Email :</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="input-field password-field">
                    <label for="password">Password :</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="eye-btn">
                            <img id="eye-icon" src="assets/icon/eye-close.png" alt="Show password">
                        </button>
                    </div>
                </div>

                <div class="forgot-link">
                    <a href="#" id="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" id="login-btn">Login</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>

            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <!-- Firebase modules -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
